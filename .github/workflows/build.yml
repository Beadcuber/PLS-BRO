name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: godmode-github-build/godmode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
          build-root-directory: godmode-github-build/godmode
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: godmode-jar
          path: godmode-github-build/godmode/build/libs/*.jar
